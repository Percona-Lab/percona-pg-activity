name: Update PG activity dashboard

on:
  schedule:
    - cron: "17 5 * * *"     # daily, 05:17 UTC
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches: [main]          # rebuild when the scripts or page change

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  AFTER: "2025-12-31"         # i.e. everything in 2026

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Commit history + trees (for "which area of PostgreSQL"), no file
      # contents, only since shortly before $AFTER: ~140 MB, ~20 s.
      - name: Clone PostgreSQL history
        run: |
          git clone --filter=blob:none --shallow-since=2025-11-01 \
            --no-single-branch --no-checkout https://github.com/postgres/postgres.git pg

      # Conference pages, feeds etc. Past events rarely change, so keep the
      # HTTP cache between runs: a warm run makes a few dozen requests.
      - uses: actions/cache@v6
        with:
          path: .cache/http
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      - name: Collect community activity
        run: |
          mkdir -p site
          python3 collect_community.py --output site/community.json

      - name: Build dashboard data
        working-directory: pg
        run: |
          mkdir -p ../site
          python3 ../build_dashboard_data.py --after "$AFTER" --output ../site/data.json
          python3 ../percona_activity.py --after "$AFTER" \
            --company-statistics --company-chart \
            --company-chart-output ../site/chart.svg > ../site/stats.md
          cp ../index.html ../site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
